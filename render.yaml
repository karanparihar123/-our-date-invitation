services:
  - type: web
    name: our-date-invitation
    runtime: node
    plan: free

    buildCommand: npm install

    startCommand: npm start

    envVars:

      - key: DATABASE_URL
        fromDatabase:
          name: our-date-db
          property: connectionString

      - key: ADMIN_KEY
        generateValue: true

      - key: NODE_ENV
        value: production

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: RESEND_API_KEY
        sync: false


databases:

  - name: our-date-db

    plan: free

    databaseName: dateinvitation

    user: dateinvitation
