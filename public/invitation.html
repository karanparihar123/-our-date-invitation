<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Moment ❤️</title>

  <style>
    /* ==========================================
       RESET
    ========================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #160817;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;

      overflow-x: hidden;
      overflow-y: auto;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: #fff;

      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(255,255,255,.18),
          transparent 25%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(255,120,160,.25),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #160817 0%,
          #3b0c2f 42%,
          #761842 72%,
          #d65c7d 100%
        );
    }


    /* ==========================================
       PAGE CENTERING
    ========================================== */

    .page {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      position: relative;
      z-index: 1;
    }


    /* ==========================================
       AMBIENT GLOW
    ========================================== */

    .glow {
      position: fixed;

      width: 320px;
      height: 320px;

      border-radius: 50%;

      filter: blur(90px);

      opacity: .22;

      pointer-events: none;

      z-index: 0;

      animation:
        glowMove 8s ease-in-out infinite alternate;
    }

    .glow.one {
      background: #ff7fa5;
      top: -120px;
      left: -100px;
    }

    .glow.two {
      background: #ffb6cf;
      right: -120px;
      bottom: -130px;

      animation-delay: 2s;
    }

    @keyframes glowMove {
      from {
        transform:
          translate(0,0)
          scale(1);
      }

      to {
        transform:
          translate(35px,-25px)
          scale(1.15);
      }
    }


    /* ==========================================
       FLOATING HEARTS
    ========================================== */

    .hearts {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      pointer-events: none;

      z-index: 1;
    }

    .heart {
      position: absolute;

      bottom: -50px;

      opacity: 0;

      animation:
        rise linear infinite;
    }

    .heart:nth-child(1) {
      left: 8%;
      font-size: 18px;
      animation-duration: 10s;
    }

    .heart:nth-child(2) {
      left: 23%;
      font-size: 13px;
      animation-duration: 13s;
      animation-delay: 3s;
    }

    .heart:nth-child(3) {
      left: 48%;
      font-size: 20px;
      animation-duration: 11s;
      animation-delay: 1s;
    }

    .heart:nth-child(4) {
      left: 72%;
      font-size: 15px;
      animation-duration: 14s;
      animation-delay: 4s;
    }

    .heart:nth-child(5) {
      left: 91%;
      font-size: 19px;
      animation-duration: 12s;
      animation-delay: 2s;
    }

    @keyframes rise {
      0% {
        transform:
          translateY(0)
          rotate(0deg);

        opacity: 0;
      }

      15% {
        opacity: .45;
      }

      85% {
        opacity: .25;
      }

      100% {
        transform:
          translateY(-115vh)
          rotate(35deg);

        opacity: 0;
      }
    }


    /* ==========================================
       MAIN CONTAINER
    ========================================== */

    .wrapper {
      width: min(560px, 100%);

      position: relative;

      z-index: 3;

      margin: auto;
    }


    /* ==========================================
       BRAND
    ========================================== */

    .brand {
      text-align: center;

      font-family:
        Arial,
        sans-serif;

      font-size: 11px;

      letter-spacing: 5px;

      text-transform: uppercase;

      opacity: .65;

      margin-bottom: 20px;
    }


    /* ==========================================
       CARD
    ========================================== */

    .card {
      position: relative;

      width: 100%;

      padding:
        38px 26px
        34px;

      text-align: center;

      border:
        1px solid
        rgba(255,255,255,.22);

      border-radius: 32px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.16),
          rgba(255,255,255,.07)
        );

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);

      box-shadow:
        0 30px 90px
        rgba(0,0,0,.38);

      overflow: hidden;

      animation:
        cardIn .9s ease-out;
    }

    .card::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,.14),
          transparent 40%
        );

      pointer-events: none;
    }

    @keyframes cardIn {
      from {
        opacity: 0;

        transform:
          translateY(30px)
          scale(.96);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    /* ==========================================
       OPENING
    ========================================== */

    .opening {
      position: relative;

      z-index: 2;

      text-align: center;
    }

    .small-text {
      font-family:
        Arial,
        sans-serif;

      font-size: 13px;

      letter-spacing: 1.5px;

      opacity: .72;

      margin-bottom: 18px;
    }

    .heart-button {
      width: 86px;
      height: 86px;

      display: flex;

      align-items: center;
      justify-content: center;

      margin:
        0 auto
        22px;

      padding: 0;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,.35);

      background:
        rgba(255,255,255,.12);

      color: #fff;

      font-size: 38px;

      cursor: pointer;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.25);

      animation:
        pulse 2s ease-in-out infinite;

      transition:
        transform .25s ease;
    }

    .heart-button:hover {
      transform:
        scale(1.08);
    }

    @keyframes pulse {
      0%,100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.07);
      }
    }


    /* ==========================================
       INVITATION CONTENT
    ========================================== */

    .invitation {
      display: none;

      position: relative;

      z-index: 2;

      animation:
        reveal .8s ease;
    }

    .invitation.show {
      display: block;
    }

    @keyframes reveal {
      from {
        opacity: 0;

        transform:
          translateY(18px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }


    /* ==========================================
       RECIPIENT
    ========================================== */

    .recipient {
      margin: 0;

      font-weight: normal;

      font-size:
        clamp(
          42px,
          12vw,
          72px
        );

      line-height: .95;

      letter-spacing: -1px;

      text-shadow:
        0 8px 30px
        rgba(0,0,0,.25);
    }

    .occasion {
      margin-top: 15px;

      font-family:
        Arial,
        sans-serif;

      font-size: 11px;

      letter-spacing: 3px;

      text-transform: uppercase;

      opacity: .65;
    }


    /* ==========================================
       DIVIDER
    ========================================== */

    .divider {
      width: 75px;
      height: 1px;

      margin:
        28px auto;

      background:
        rgba(255,255,255,.45);
    }


    /* ==========================================
       MESSAGE
    ========================================== */

    .message {
      max-width: 470px;

      margin:
        0 auto
        24px;

      font-size:
        clamp(
          21px,
          5vw,
          28px
        );

      line-height: 1.45;
    }

    .message::before {
      content: "“";

      opacity: .45;
    }

    .message::after {
      content: "”";

      opacity: .45;
    }


    /* ==========================================
       CREATOR
    ========================================== */

    .from {
      font-family:
        Arial,
        sans-serif;

      font-size: 14px;

      opacity: .72;

      margin-bottom: 32px;
    }


    /* ==========================================
       QUESTION
    ========================================== */

    .question {
      font-size: 20px;

      margin-bottom: 18px;
    }


    /* ==========================================
       BUTTONS
    ========================================== */

    .buttons {
      display: flex;

      gap: 12px;

      justify-content: center;

      align-items: center;
    }

    button {
      border: 0;

      font-family:
        Arial,
        sans-serif;

      font-weight: 600;

      font-size: 15px;

      cursor: pointer;

      border-radius: 999px;

      padding:
        14px 23px;

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    button:hover {
      transform:
        translateY(-2px);
    }

    button:active {
      transform:
        scale(.97);
    }

    .yes {
      color: #74153f;

      background: #fff;

      box-shadow:
        0 12px 30px
        rgba(0,0,0,.2);
    }

    .maybe {
      color: #fff;

      background:
        rgba(255,255,255,.10);

      border:
        1px solid
        rgba(255,255,255,.25);
    }


    /* ==========================================
       DATE
    ========================================== */

    .date-section {
      display: none;

      margin-top: 28px;

      animation:
        reveal .5s ease;
    }

    .date-title {
      font-size: 18px;

      margin-bottom: 12px;
    }

    .date-input {
      width:
        min(
          300px,
          100%
        );

      padding:
        14px 16px;

      border: 0;

      border-radius: 14px;

      font-family:
        Arial,
        sans-serif;

      font-size: 16px;

      outline: none;

      background: #fff;

      color: #222;
    }

    .confirm {
      margin-top: 14px;

      color: #fff;

      background: #941f5a;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.25);
    }

    .confirm:disabled {
      opacity: .6;

      cursor: not-allowed;
    }


    /* ==========================================
       STATUS
    ========================================== */

    .status {
      margin-top: 25px;

      font-family:
        Arial,
        sans-serif;

      font-size: 15px;

      line-height: 1.7;
    }

    .success-heart {
      display: block;

      font-size: 55px;

      margin-bottom: 10px;

      animation:
        successPop .6s ease;
    }

    @keyframes successPop {
      0% {
        transform:
          scale(.3);

        opacity: 0;
      }

      70% {
        transform:
          scale(1.15);
      }

      100% {
        transform:
          scale(1);

        opacity: 1;
      }
    }


    /* ==========================================
       FOOTER
    ========================================== */

    .footer {
      margin-top: 28px;

      font-family:
        Arial,
        sans-serif;

      font-size: 10px;

      letter-spacing: 3px;

      opacity: .38;
    }


    /* ==========================================
       ERROR
    ========================================== */

    .error {
      font-family:
        Arial,
        sans-serif;

      font-size: 15px;

      padding: 25px;
    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 600px) {

      body {
        overflow-x: hidden;
      }

      .page {
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;

        padding:
          16px
          max(16px, env(safe-area-inset-right))
          16px
          max(16px, env(safe-area-inset-left));
      }

      .wrapper {
        width: 100%;
        max-width: 560px;

        margin:
          auto
          0;
      }

      .brand {
        margin-bottom: 14px;
      }

      .card {
        width: 100%;

        padding:
          32px 19px
          28px;

        border-radius: 27px;
      }

      .buttons {
        flex-direction: column;

        width: 100%;
      }

      .buttons button {
        width: 100%;
      }

      .recipient {
        font-size:
          clamp(
            42px,
            15vw,
            64px
          );
      }

      .message {
        font-size:
          clamp(
            20px,
            6vw,
            26px
          );
      }
    }


    /* ==========================================
       VERY SMALL PHONES
    ========================================== */

    @media (max-width: 380px) {

      .page {
        padding: 12px;
      }

      .card {
        padding:
          28px 16px
          24px;
      }

      .heart-button {
        width: 78px;
        height: 78px;
        font-size: 34px;
      }

      .question {
        font-size: 18px;
      }
    }


    /* ==========================================
       LANDSCAPE MOBILE
    ========================================== */

    @media (
      max-height: 600px
    ) and (
      orientation: landscape
    ) {

      .page {
        align-items: flex-start;

        padding-top: 20px;
        padding-bottom: 20px;
      }

      .wrapper {
        margin:
          0
          auto;
      }
    }

  </style>
</head>


<body>

  <!-- ========================================
       BACKGROUND
  ========================================= -->

  <div class="glow one"></div>
  <div class="glow two"></div>


  <!-- ========================================
       FLOATING HEARTS
  ========================================= -->

  <div class="hearts" aria-hidden="true">

    <span class="heart">❤️</span>
    <span class="heart">💗</span>
    <span class="heart">💕</span>
    <span class="heart">❤️</span>
    <span class="heart">💗</span>

  </div>


  <!-- ========================================
       CENTERED PAGE
  ========================================= -->

  <div class="page">

    <div class="wrapper">

      <div class="brand">
        Moment
      </div>


      <main class="card">


        <!-- ==================================
             OPENING
        =================================== -->

        <section
          id="opening"
          class="opening"
        >

          <div class="small-text">
            A little moment for you
          </div>


          <button
            id="openButton"
            class="heart-button"
            type="button"
            aria-label="Open invitation"
          >
            ❤️
          </button>


          <div class="small-text">
            Tap to open
          </div>

        </section>


        <!-- ==================================
             INVITATION
        =================================== -->

        <section
          id="invitation"
          class="invitation"
        >

          <div
            id="occasion"
            class="occasion"
          >
            A little invitation
          </div>


          <div class="divider"></div>


          <h1
            id="recipientName"
            class="recipient"
          >
            You
          </h1>


          <div class="divider"></div>


          <p
            id="message"
            class="message"
          >
            I have something important
            to ask you.
          </p>


          <div
            id="from"
            class="from"
          >
            From someone special ❤️
          </div>


          <div
            id="question"
            class="question"
          >
            When do I get to steal you
            for a date?
          </div>


          <div
            id="buttons"
            class="buttons"
          >

            <button
              id="yesButton"
              class="yes"
              type="button"
            >
              Yes, it's a date ❤️
            </button>


            <button
              id="maybeButton"
              class="maybe"
              type="button"
            >
              Maybe later
            </button>

          </div>


          <!-- ================================
               DATE SELECTION
          ================================= -->

          <section
            id="dateSection"
            class="date-section"
          >

            <div class="date-title">
              Pick our date ❤️
            </div>


            <input
              id="dateInput"
              class="date-input"
              type="date"
              aria-label="Select date"
            >


            <br>


            <button
              id="confirmButton"
              class="confirm"
              type="button"
            >
              Confirm date ❤️
            </button>

          </section>


          <!-- ================================
               STATUS
          ================================= -->

          <div
            id="status"
            class="status"
            aria-live="polite"
          ></div>


          <div class="footer">
            MADE WITH MOMENT ❤️
          </div>

        </section>

      </main>

    </div>

  </div>


  <!-- ========================================
       JAVASCRIPT
  ========================================= -->

  <script>

    /* ========================================
       INVITATION CODE
    ========================================= */

    const parts =
      window.location.pathname
        .split("/")
        .filter(Boolean);


    const invitationCode =
      parts[0] === "i"
        ? parts[1]
        : null;


    /* ========================================
       ELEMENTS
    ========================================= */

    const opening =
      document.getElementById("opening");

    const openButton =
      document.getElementById("openButton");

    const invitation =
      document.getElementById("invitation");

    const recipientName =
      document.getElementById("recipientName");

    const occasion =
      document.getElementById("occasion");

    const message =
      document.getElementById("message");

    const from =
      document.getElementById("from");

    const yesButton =
      document.getElementById("yesButton");

    const maybeButton =
      document.getElementById("maybeButton");

    const buttons =
      document.getElementById("buttons");

    const dateSection =
      document.getElementById("dateSection");

    const dateInput =
      document.getElementById("dateInput");

    const confirmButton =
      document.getElementById("confirmButton");

    const status =
      document.getElementById("status");


    /* ========================================
       TODAY
       Uses LOCAL browser date rather than
       UTC so India/mobile users don't get
       the wrong minimum date.
    ========================================= */

    function getTodayLocal() {

      const now =
        new Date();

      const year =
        now.getFullYear();

      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          now.getDate()
        ).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }


    const today =
      getTodayLocal();


    dateInput.min =
      today;


    /* ========================================
       OPEN INVITATION
    ========================================= */

    openButton.addEventListener(
      "click",
      () => {

        opening.style.display =
          "none";

        invitation.classList.add(
          "show"
        );

      }
    );


    /* ========================================
       LOAD INVITATION
    ========================================= */

    async function loadInvitation() {

      if (!invitationCode) {

        opening.innerHTML = `
          <div class="error">
            This invitation link is invalid. ❤️
          </div>
        `;

        return;
      }


      try {

        const response =
          await fetch(
            `/api/invitations/${encodeURIComponent(invitationCode)}`
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Invitation not found."
          );

        }


        recipientName.textContent =
          data.recipient_name;


        if (data.occasion) {

          occasion.textContent =
            data.occasion;

        }


        if (data.message) {

          message.textContent =
            data.message;

        }


        if (data.creator_name) {

          from.textContent =
            `From ${data.creator_name} ❤️`;

        }


        document.title =
          `${data.recipient_name} ❤️ | Moment`;

      }


      catch (error) {

        console.error(
          "Invitation loading error:",
          error
        );


        opening.innerHTML = `
          <div class="error">
            ${
              error.message ||
              "Could not load invitation."
            }
          </div>
        `;

      }

    }


    /* ========================================
       YES BUTTON
    ========================================= */

    yesButton.addEventListener(
      "click",
      () => {

        buttons.style.display =
          "none";

        dateSection.style.display =
          "block";

        dateInput.focus();

      }
    );


    /* ========================================
       MAYBE BUTTON
    ========================================= */

    maybeButton.addEventListener(
      "click",
      () => {

        buttons.style.display =
          "none";

        status.innerHTML = `
          <span class="success-heart">
            💌
          </span>

          <strong>
            I'll take that as a maybe. 😌❤️
          </strong>

          <br>

          I'll be waiting.
        `;

      }
    );


    /* ========================================
       CONFIRM DATE
    ========================================= */

    confirmButton.addEventListener(
      "click",
      async () => {

        const selectedDate =
          dateInput.value;


        if (!selectedDate) {

          status.textContent =
            "Please choose a date ❤️";

          return;

        }


        /* ------------------------------------
           FRONTEND DATE VALIDATION
        ------------------------------------ */

        if (selectedDate < today) {

          status.textContent =
            "Please choose today or a future date ❤️";

          dateInput.focus();

          return;

        }


        confirmButton.disabled =
          true;

        confirmButton.textContent =
          "Saving...";


        try {

          const response =
            await fetch(
              "/api/response",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    answer: "yes",
                    date: selectedDate,
                    invitationCode
                  })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.error ||
              "Could not save response."
            );

          }


          dateSection.style.display =
            "none";


          const displayDate =
            new Date(
              `${selectedDate}T00:00:00`
            ).toLocaleDateString(
              "en-IN",
              {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
              }
            );


          status.innerHTML = `
            <span class="success-heart">
              ❤️
            </span>

            <strong>
              It's a date!
            </strong>

            <br>

            ${displayDate}

            <br><br>

            <span style="opacity:.7;">
              See you then. 🥰
            </span>
          `;

        }


        catch (error) {

          console.error(
            "Response error:",
            error
          );


          status.textContent =
            error.message ||
            "Something went wrong.";


          confirmButton.disabled =
            false;

          confirmButton.textContent =
            "Confirm date ❤️";

        }

      }
    );


    /* ========================================
       LOAD PAGE
    ========================================= */

    loadInvitation();

  </script>

</body>
</html>
