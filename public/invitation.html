<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Moment ❤️</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:24px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color:#fff;

  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(255,255,255,.25) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle at 85% 75%,
      rgba(255,210,225,.35) 0 2px,
      transparent 3px
    ),

    linear-gradient(
      135deg,
      #23091f,
      #641139 50%,
      #e85d78
    );

  background-size:
    130px 130px,
    180px 180px,
    cover;

  overflow-x:hidden;

}


/* ==========================================
   FLOATING HEARTS
========================================== */

.heart{

  position:fixed;

  bottom:-40px;

  font-size:20px;

  opacity:.55;

  pointer-events:none;

  animation:
    floatUp linear infinite;

}

.heart:nth-child(1){
  left:8%;
  animation-duration:9s;
}

.heart:nth-child(2){
  left:24%;
  animation-duration:12s;
  animation-delay:2s;
}

.heart:nth-child(3){
  left:52%;
  animation-duration:10s;
  animation-delay:4s;
}

.heart:nth-child(4){
  left:76%;
  animation-duration:13s;
  animation-delay:1s;
}

.heart:nth-child(5){
  left:91%;
  animation-duration:11s;
  animation-delay:5s;
}


@keyframes floatUp{

  0%{
    transform:
      translateY(0)
      rotate(0deg);
    opacity:0;
  }

  15%{
    opacity:.55;
  }

  100%{
    transform:
      translateY(-110vh)
      rotate(25deg);
    opacity:0;
  }

}


/* ==========================================
   CARD
========================================== */

.card{

  width:min(
    650px,
    100%
  );

  padding:
    42px 28px
    38px;

  text-align:center;

  background:
    rgba(255,255,255,.12);

  border:
    1px solid
    rgba(255,255,255,.28);

  border-radius:30px;

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.35);

  animation:
    cardEnter .8s ease-out;

}


@keyframes cardEnter{

  from{
    opacity:0;
    transform:
      translateY(25px)
      scale(.97);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}


/* ==========================================
   BRAND
========================================== */

.brand{

  font-family:
    Arial,
    sans-serif;

  font-size:13px;

  letter-spacing:4px;

  text-transform:uppercase;

  opacity:.75;

  margin-bottom:25px;

}


/* ==========================================
   HEART
========================================== */

.main-heart{

  font-size:48px;

  margin-bottom:12px;

  animation:
    heartbeat 1.8s ease-in-out infinite;

}


@keyframes heartbeat{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.12);
  }

}


/* ==========================================
   RECIPIENT
========================================== */

.recipient{

  margin:0;

  font-size:
    clamp(
      38px,
      9vw,
      64px
    );

  line-height:1.05;

  font-weight:normal;

  text-shadow:
    0 4px 20px
    rgba(0,0,0,.2);

}


/* ==========================================
   OCCASION
========================================== */

.occasion{

  margin-top:14px;

  font-family:
    Arial,
    sans-serif;

  font-size:15px;

  letter-spacing:2px;

  text-transform:uppercase;

  opacity:.8;

}


/* ==========================================
   DIVIDER
========================================== */

.divider{

  width:80px;

  height:1px;

  margin:
    30px auto;

  background:
    rgba(255,255,255,.5);

}


/* ==========================================
   MESSAGE
========================================== */

.message{

  font-size:
    clamp(
      21px,
      5vw,
      28px
    );

  line-height:1.5;

  margin:
    0 auto
    25px;

  max-width:520px;

}


.message::before{
  content:"“";
  opacity:.5;
}


.message::after{
  content:"”";
  opacity:.5;
}


/* ==========================================
   FROM
========================================== */

.from{

  font-size:17px;

  opacity:.85;

  margin-bottom:30px;

}


/* ==========================================
   QUESTION
========================================== */

.question{

  font-size:22px;

  margin-bottom:18px;

}


/* ==========================================
   BUTTONS
========================================== */

.buttons{

  display:flex;

  gap:12px;

  justify-content:center;

  flex-wrap:wrap;

}


button{

  border:0;

  cursor:pointer;

  font-family:
    Arial,
    sans-serif;

  font-size:16px;

  font-weight:600;

  padding:
    14px 25px;

  border-radius:999px;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    opacity .2s ease;

}


button:hover{

  transform:
    translateY(-2px);

}


button:active{

  transform:
    scale(.97);

}


.yes{

  color:#941f5a;

  background:#fff;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.2);

}


.maybe{

  color:#fff;

  background:
    rgba(255,255,255,.15);

  border:
    1px solid
    rgba(255,255,255,.3);

}


/* ==========================================
   DATE SECTION
========================================== */

#dateSection{

  display:none;

  margin-top:28px;

  animation:
    fadeIn .5s ease;

}


@keyframes fadeIn{

  from{
    opacity:0;
    transform:
      translateY(10px);
  }

  to{
    opacity:1;
    transform:
      translateY(0);
  }

}


.date-label{

  font-family:
    Arial,
    sans-serif;

  font-size:14px;

  opacity:.8;

  margin-bottom:10px;

}


input[type="date"]{

  width:100%;

  max-width:300px;

  padding:
    14px 16px;

  border:0;

  border-radius:14px;

  font-family:
    Arial,
    sans-serif;

  font-size:16px;

  outline:none;

}


.confirm{

  margin-top:14px;

  color:#fff;

  background:
    #941f5a;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.25);

}


button:disabled{

  opacity:.6;

  cursor:not-allowed;

  transform:none;

}


/* ==========================================
   STATUS
========================================== */

#status{

  margin-top:28px;

  font-family:
    Arial,
    sans-serif;

  font-size:16px;

  line-height:1.6;

}


/* ==========================================
   FOOTER
========================================== */

.footer{

  margin-top:35px;

  font-family:
    Arial,
    sans-serif;

  font-size:11px;

  letter-spacing:2px;

  opacity:.45;

}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:480px){

  body{

    padding:15px;

  }

  .card{

    padding:
      34px 20px
      30px;

    border-radius:25px;

  }

  .message{

    font-size:20px;

  }

  .buttons{

    flex-direction:column;

  }

  button{

    width:100%;

  }

}

</style>

</head>


<body>

<!-- Floating hearts -->

<div class="heart">❤️</div>
<div class="heart">💗</div>
<div class="heart">💕</div>
<div class="heart">❤️</div>
<div class="heart">💗</div>


<main class="card">

  <div class="brand">
    Moment
  </div>


  <div class="main-heart">
    ❤️
  </div>


  <h1
    id="recipientName"
    class="recipient"
  >
    You
  </h1>


  <div
    id="occasion"
    class="occasion"
  >
    A little invitation
  </div>


  <div class="divider"></div>


  <p
    id="message"
    class="message"
  >
    I have something important
    to ask you.
  </p>


  <div
    id="from"
    class="from"
  >
    From someone who likes you ❤️
  </div>


  <div
    id="question"
    class="question"
  >
    When do I get to steal you
    for a date?
  </div>


  <div class="buttons">

    <button
      id="yesButton"
      class="yes"
    >
      Yes ❤️
    </button>


    <button
      id="maybeButton"
      class="maybe"
    >
      Maybe later
    </button>

  </div>


  <!-- DATE SELECTION -->

  <section
    id="dateSection"
  >

    <div class="date-label">
      Pick a date ❤️
    </div>


    <input
      id="dateInput"
      type="date"
    >


    <br>


    <button
      id="confirmButton"
      class="confirm"
    >
      Confirm date ❤️
    </button>

  </section>


  <div
    id="status"
  ></div>


  <div class="footer">
    MADE WITH MOMENT ❤️
  </div>

</main>


<script>

/* ==========================================
   GET INVITATION CODE
========================================== */

const pathParts =
  window.location.pathname
    .split("/")
    .filter(Boolean);


const invitationCode =
  pathParts[0] === "i"
    ? pathParts[1]
    : null;


/* ==========================================
   ELEMENTS
========================================== */

const recipientName =
  document.getElementById(
    "recipientName"
  );

const occasion =
  document.getElementById(
    "occasion"
  );

const message =
  document.getElementById(
    "message"
  );

const from =
  document.getElementById(
    "from"
  );

const yesButton =
  document.getElementById(
    "yesButton"
  );

const maybeButton =
  document.getElementById(
    "maybeButton"
  );

const dateSection =
  document.getElementById(
    "dateSection"
  );

const dateInput =
  document.getElementById(
    "dateInput"
  );

const confirmButton =
  document.getElementById(
    "confirmButton"
  );

const status =
  document.getElementById(
    "status"
  );


/* ==========================================
   LOAD INVITATION
========================================== */

async function loadInvitation(){

  if(!invitationCode){

    status.textContent =
      "This invitation link is invalid.";

    yesButton.disabled =
      true;

    maybeButton.disabled =
      true;

    return;

  }


  try{

    const response =
      await fetch(
        `/api/invitations/${invitationCode}`
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Invitation not found."
      );

    }


    /* --------------------------------------
       PERSONALIZATION
    -------------------------------------- */

    recipientName.textContent =
      data.recipient_name;


    if(data.occasion){

      occasion.textContent =
        data.occasion;

    }


    if(data.message){

      message.textContent =
        data.message;

    }


    if(data.creator_name){

      from.textContent =
        `From ${data.creator_name} ❤️`;

    }


    document.title =
      `${data.recipient_name} ❤️ | Moment`;


  }catch(error){

    console.error(error);

    status.textContent =
      error.message ||
      "Could not load invitation.";

    yesButton.disabled =
      true;

    maybeButton.disabled =
      true;

  }

}


/* ==========================================
   YES
========================================== */

yesButton.addEventListener(
  "click",
  () => {

    dateSection.style.display =
      "block";

    yesButton.style.display =
      "none";

    maybeButton.style.display =
      "none";

    dateInput.focus();

  }
);


/* ==========================================
   MAYBE
========================================== */

maybeButton.addEventListener(
  "click",
  () => {

    yesButton.style.display =
      "none";

    maybeButton.style.display =
      "none";

    status.innerHTML =
      `
        <strong>
          I'll take that as a "maybe". 😌❤️
        </strong>
        <br>
        I'll be waiting.
      `;

  }
);


/* ==========================================
   CONFIRM DATE
========================================== */

confirmButton.addEventListener(
  "click",
  async () => {

    const selectedDate =
      dateInput.value;


    if(!selectedDate){

      status.textContent =
        "Please choose a date ❤️";

      return;

    }


    confirmButton.disabled =
      true;

    confirmButton.textContent =
      "Saving...";


    try{

      const response =
        await fetch(
          "/api/response",
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                answer:"yes",

                date:
                  selectedDate,

                invitationCode

              })

          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.error ||
          "Could not save response."
        );

      }


      dateSection.style.display =
        "none";


      status.innerHTML =
        `
          <strong>
            It's a date! ❤️
          </strong>

          <br><br>

          ${new Date(
            selectedDate +
            "T00:00:00"
          ).toLocaleDateString(
            "en-IN",
            {
              weekday:"long",
              year:"numeric",
              month:"long",
              day:"numeric"
            }
          )}

          <br><br>

          <span style="opacity:.75;">
            See you then. 🥰
          </span>
        `;


    }catch(error){

      console.error(error);


      status.textContent =
        error.message ||
        "Something went wrong.";


      confirmButton.disabled =
        false;

      confirmButton.textContent =
        "Confirm date ❤️";

    }

  }
);


/* ==========================================
   LOAD
========================================== */

loadInvitation();

</script>

</body>

</html>
