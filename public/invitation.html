<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Your Invitation ❤️</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:30px;

  font-family:Georgia,serif;

  color:#fff;

  background:
    radial-gradient(
      circle at 20% 20%,
      #fff 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle at 80% 70%,
      #ffd5df 0 2px,
      transparent 3px
    ),

    linear-gradient(
      135deg,
      #280b25,
      #711441 50%,
      #ff7189
    );

  background-size:
    130px 130px,
    170px 170px,
    cover;

}


.card{

  width:min(
    650px,
    100%
  );

  padding:45px 30px;

  text-align:center;

  border-radius:30px;

  background:#ffffff18;

  border:
    1px solid
    #ffffff35;

  backdrop-filter:
    blur(18px);

  box-shadow:
    0 30px 80px
    #22001966;

}


.emoji{

  font-size:70px;

  margin-bottom:15px;

}


h1{

  margin:10px 0;

  font-size:42px;

}


h2{

  margin:15px 0 25px;

  font-size:28px;

}


.message{

  font-size:20px;

  line-height:1.7;

  margin:25px auto;

  max-width:520px;

}


.from{

  font-size:16px;

  opacity:.8;

}


.buttons{

  margin-top:35px;

  display:flex;

  justify-content:center;

  gap:15px;

  flex-wrap:wrap;

}


button{

  border:0;

  border-radius:999px;

  padding:15px 28px;

  font-family:Georgia,serif;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

}


.yes{

  background:#fff;

  color:#941f5a;

}


.no{

  background:#ffffff22;

  color:#fff;

  border:
    1px solid
    #ffffff55;

}


.date-section{

  display:none;

  margin-top:30px;

}


.date-section p{

  font-size:17px;

}


input[type="date"]{

  padding:13px;

  border:0;

  border-radius:12px;

  font-size:16px;

}


.confirm{

  margin-top:15px;

  background:#fff;

  color:#941f5a;

}


.status{

  margin-top:25px;

  font-size:18px;

  line-height:1.6;

}


.error{

  color:#ffd5df;

}


@media(max-width:600px){

  h1{
    font-size:34px;
  }

  h2{
    font-size:24px;
  }

  .message{
    font-size:18px;
  }

}

</style>

</head>


<body>


<div class="card">


<div
  class="emoji"
  id="emoji"
>
  ❤️
</div>


<h1 id="recipient">
  Loading...
</h1>


<h2 id="title">
  Your invitation
</h2>


<div
  class="message"
  id="message"
>
  Please wait...
</div>


<div
  class="from"
  id="from"
></div>


<div
  class="buttons"
  id="buttons"
>

<button
  class="yes"
  id="yesButton"
>
  Yes ❤️
</button>


<button
  class="no"
  id="noButton"
>
  Maybe later
</button>

</div>


<div
  class="date-section"
  id="dateSection"
>

<p>
  Pick a date ❤️
</p>


<input
  type="date"
  id="dateInput"
>


<br>


<button
  class="confirm"
  id="confirmButton"
>
  Confirm date ❤️
</button>

</div>


<div
  class="status"
  id="status"
></div>


</div>


<script>


/* =====================================
   ELEMENTS
===================================== */

const recipient =
  document.getElementById(
    "recipient"
  );

const title =
  document.getElementById(
    "title"
  );

const message =
  document.getElementById(
    "message"
  );

const from =
  document.getElementById(
    "from"
  );

const emoji =
  document.getElementById(
    "emoji"
  );

const buttons =
  document.getElementById(
    "buttons"
  );

const yesButton =
  document.getElementById(
    "yesButton"
  );

const noButton =
  document.getElementById(
    "noButton"
  );

const dateSection =
  document.getElementById(
    "dateSection"
  );

const dateInput =
  document.getElementById(
    "dateInput"
  );

const confirmButton =
  document.getElementById(
    "confirmButton"
  );

const status =
  document.getElementById(
    "status"
  );


/* =====================================
   OCCASION DATA
===================================== */

const occasionData = {

  date:{
    emoji:"❤️",
    title:
      "When do I get to steal you for a date?"
  },

  birthday:{
    emoji:"🎂",
    title:
      "Want to celebrate your special day together?"
  },

  proposal:{
    emoji:"💍",
    title:
      "Will you say yes?"
  },

  anniversary:{
    emoji:"🥂",
    title:
      "Another chapter of our story ❤️"
  },

  party:{
    emoji:"🎉",
    title:
      "You're invited!"
  }

};


/* =====================================
   GET INVITATION CODE
===================================== */

const pathParts =
  window.location
    .pathname
    .split("/")
    .filter(Boolean);


/*

Expected:

/i/abc123

pathParts becomes:

["i","abc123"]

*/

const invitationCode =
  pathParts[0] === "i"
    ? pathParts[1]
    : null;


/* =====================================
   LOAD INVITATION
===================================== */

async function loadInvitation(){

  if(!invitationCode){

    recipient.textContent =
      "Invitation not found";

    message.textContent =
      "This invitation link is invalid.";

    return;

  }


  try {

    const response =
      await fetch(
        `/api/invitations/${invitationCode}`
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Invitation not found."
      );

    }


    /* ----------------------------------
       FILL PAGE
    ---------------------------------- */

    recipient.textContent =
      data.recipient_name;


    const selected =
      occasionData[
        data.occasion
      ] ||
      occasionData.date;


    emoji.textContent =
      selected.emoji;


    title.textContent =
      selected.title;


    message.textContent =
      data.message ||
      "Just you, me, and a little time together. ❤️";


    from.textContent =
      `From ${data.creator_name} ❤️`;


  } catch(error){

    console.error(error);


    recipient.textContent =
      "Invitation not found";


    title.textContent =
      "Something went wrong";


    message.textContent =
      error.message;


    buttons.style.display =
      "none";

  }

}


/* =====================================
   YES
===================================== */

yesButton.addEventListener(
  "click",
  () => {

    dateSection.style.display =
      "block";

    status.textContent =
      "Yay! ❤️ Pick a date.";

    yesButton.style.display =
      "none";

    noButton.style.display =
      "none";

  }
);


/* =====================================
   NO
===================================== */

noButton.addEventListener(
  "click",
  async () => {

    status.textContent =
      "That's okay ❤️";


    buttons.style.display =
      "none";


    try {

      await fetch(
        "/api/response",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              answer:"no",

              date:
                new Date()
                  .toISOString()
                  .split("T")[0],

              invitationCode

            })

        }
      );


    } catch(error){

      console.error(error);

    }

  }
);


/* =====================================
   CONFIRM DATE
===================================== */

confirmButton.addEventListener(
  "click",
  async () => {

    const selectedDate =
      dateInput.value;


    if(!selectedDate){

      alert(
        "Please choose a date ❤️"
      );

      return;

    }


    confirmButton.disabled =
      true;

    confirmButton.textContent =
      "Saving...";


    try {

      const response =
        await fetch(
          "/api/response",
          {

            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                answer:"yes",

                date:
                  selectedDate,

                invitationCode

              })

          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.error ||
          "Could not save response."
        );

      }


      dateSection.style.display =
        "none";


      status.innerHTML =
        `
          <strong>
            It's a date! ❤️
          </strong>
          <br><br>
          ${new Date(
            selectedDate + "T00:00:00"
          ).toLocaleDateString(
            "en-IN",
            {
              weekday:"long",
              year:"numeric",
              month:"long",
              day:"numeric"
            }
          )}
        `;


    } catch(error){

      console.error(error);


      status.textContent =
        error.message ||
        "Something went wrong.";


      confirmButton.disabled =
        false;

      confirmButton.textContent =
        "Confirm date ❤️";

    }

  }
);


/* =====================================
   LOAD
===================================== */

loadInvitation();

</script>

</body>

</html>
