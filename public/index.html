```html
<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Moment — Create a beautiful invitation for someone special."
  >

  <title>Moment ❤️</title>


  <style>

    /* ==========================================
       RESET
    ========================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }


    html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #160817;
    }


    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;

      overflow-x: hidden;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: #fff;

      background:
        radial-gradient(
          circle at 18% 12%,
          rgba(255,255,255,.18),
          transparent 25%
        ),

        radial-gradient(
          circle at 88% 88%,
          rgba(255,120,160,.25),
          transparent 30%
        ),

        linear-gradient(
          145deg,
          #160817 0%,
          #3b0c2f 42%,
          #761842 72%,
          #d65c7d 100%
        );
    }


    /* ==========================================
       PAGE
    ========================================== */

    .page {

      position: relative;

      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        max(24px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      overflow: hidden;
    }


    /* ==========================================
       BACKGROUND GLOWS
    ========================================== */

    .glow {

      position: fixed;

      width: 340px;
      height: 340px;

      border-radius: 50%;

      filter: blur(95px);

      opacity: .22;

      pointer-events: none;

      z-index: 0;

      animation:
        glowMove 9s ease-in-out infinite alternate;
    }


    .glow.one {

      background: #ff7fa5;

      top: -130px;
      left: -110px;
    }


    .glow.two {

      background: #ffb6cf;

      right: -130px;
      bottom: -140px;

      animation-delay: 2s;
    }


    @keyframes glowMove {

      from {
        transform:
          translate(0, 0)
          scale(1);
      }

      to {
        transform:
          translate(35px, -25px)
          scale(1.15);
      }

    }


    /* ==========================================
       FLOATING HEARTS
    ========================================== */

    .hearts {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      pointer-events: none;

      z-index: 1;
    }


    .heart {

      position: absolute;

      bottom: -50px;

      opacity: 0;

      animation:
        rise linear infinite;
    }


    .heart:nth-child(1) {
      left: 8%;
      font-size: 18px;
      animation-duration: 10s;
    }


    .heart:nth-child(2) {
      left: 25%;
      font-size: 13px;
      animation-duration: 13s;
      animation-delay: 3s;
    }


    .heart:nth-child(3) {
      left: 48%;
      font-size: 20px;
      animation-duration: 11s;
      animation-delay: 1s;
    }


    .heart:nth-child(4) {
      left: 72%;
      font-size: 15px;
      animation-duration: 14s;
      animation-delay: 4s;
    }


    .heart:nth-child(5) {
      left: 91%;
      font-size: 19px;
      animation-duration: 12s;
      animation-delay: 2s;
    }


    @keyframes rise {

      0% {
        transform:
          translateY(0)
          rotate(0deg);

        opacity: 0;
      }

      15% {
        opacity: .45;
      }

      85% {
        opacity: .25;
      }

      100% {
        transform:
          translateY(-115vh)
          rotate(35deg);

        opacity: 0;
      }

    }


    /* ==========================================
       CONTENT
    ========================================== */

    .wrapper {

      position: relative;

      z-index: 3;

      width: min(620px, 100%);

      margin: auto;
    }


    /* ==========================================
       BRAND
    ========================================== */

    .brand {

      text-align: center;

      font-family:
        Arial,
        sans-serif;

      font-size: 11px;

      letter-spacing: 6px;

      text-transform: uppercase;

      opacity: .65;

      margin-bottom: 20px;
    }


    /* ==========================================
       CARD
    ========================================== */

    .card {

      position: relative;

      width: 100%;

      padding:
        58px 38px
        48px;

      text-align: center;

      border:
        1px solid
        rgba(255,255,255,.22);

      border-radius: 34px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.16),
          rgba(255,255,255,.07)
        );

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);

      box-shadow:
        0 30px 90px
        rgba(0,0,0,.38);

      overflow: hidden;

      animation:
        cardIn .9s ease-out;
    }


    .card::before {

      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,.15),
          transparent 40%
        );

      pointer-events: none;
    }


    @keyframes cardIn {

      from {
        opacity: 0;

        transform:
          translateY(30px)
          scale(.96);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    /* ==========================================
       HEART
    ========================================== */

    .hero-heart {

      position: relative;

      z-index: 2;

      width: 92px;
      height: 92px;

      margin:
        0 auto
        28px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        rgba(255,255,255,.12);

      border:
        1px solid
        rgba(255,255,255,.30);

      box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);

      font-size: 42px;

      animation:
        pulse 2s ease-in-out infinite;
    }


    @keyframes pulse {

      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.07);
      }

    }


    /* ==========================================
       HEADING
    ========================================== */

    .eyebrow {

      position: relative;

      z-index: 2;

      margin: 0 0 14px;

      font-family:
        Arial,
        sans-serif;

      font-size: 12px;

      letter-spacing: 3px;

      text-transform: uppercase;

      opacity: .65;
    }


    h1 {

      position: relative;

      z-index: 2;

      margin: 0;

      font-weight: normal;

      font-size:
        clamp(
          52px,
          12vw,
          82px
        );

      line-height: .95;

      letter-spacing: -2px;

      text-shadow:
        0 10px 35px
        rgba(0,0,0,.25);
    }


    .subtitle {

      position: relative;

      z-index: 2;

      max-width: 460px;

      margin:
        25px auto
        34px;

      font-size:
        clamp(
          20px,
          4.8vw,
          27px
        );

      line-height: 1.45;

      opacity: .82;
    }


    /* ==========================================
       DIVIDER
    ========================================== */

    .divider {

      position: relative;

      z-index: 2;

      width: 70px;

      height: 1px;

      margin:
        0 auto
        32px;

      background:
        rgba(255,255,255,.45);
    }


    /* ==========================================
       BUTTONS
    ========================================== */

    .actions {

      position: relative;

      z-index: 2;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 12px;
    }


    .button {

      border: 0;

      border-radius: 999px;

      padding:
        15px 27px;

      font-family:
        Arial,
        sans-serif;

      font-size: 15px;

      font-weight: 600;

      text-decoration: none;

      cursor: pointer;

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }


    .button:hover {

      transform:
        translateY(-3px);
    }


    .button:active {

      transform:
        scale(.97);
    }


    .primary {

      color: #74153f;

      background: #fff;

      box-shadow:
        0 14px 35px
        rgba(0,0,0,.22);
    }


    .primary:hover {

      box-shadow:
        0 18px 42px
        rgba(0,0,0,.30);
    }


    .secondary {

      color: #fff;

      background:
        rgba(255,255,255,.10);

      border:
        1px solid
        rgba(255,255,255,.25);
    }


    .secondary:hover {

      background:
        rgba(255,255,255,.17);
    }


    /* ==========================================
       SUPPORTING TEXT
    ========================================== */

    .support {

      position: relative;

      z-index: 2;

      margin-top: 34px;

      font-family:
        Arial,
        sans-serif;

      font-size: 12px;

      line-height: 1.6;

      opacity: .55;
    }


    /* ==========================================
       FOOTER
    ========================================== */

    .footer {

      position: relative;

      z-index: 2;

      margin-top: 28px;

      text-align: center;

      font-family:
        Arial,
        sans-serif;

      font-size: 10px;

      letter-spacing: 3px;

      opacity: .38;
    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 600px) {

      .page {

        padding:
          18px
          max(16px, env(safe-area-inset-right))
          18px
          max(16px, env(safe-area-inset-left));
      }


      .wrapper {

        width: 100%;
      }


      .brand {

        margin-bottom: 14px;
      }


      .card {

        padding:
          46px 22px
          38px;

        border-radius: 28px;
      }


      .hero-heart {

        width: 82px;
        height: 82px;

        font-size: 37px;

        margin-bottom: 25px;
      }


      h1 {

        font-size:
          clamp(
            48px,
            16vw,
            70px
          );
      }


      .subtitle {

        font-size:
          clamp(
            19px,
            6vw,
            24px
          );

        margin-top: 22px;
        margin-bottom: 30px;
      }


      .actions {

        flex-direction: column;

        width: 100%;
      }


      .button {

        width: 100%;
      }


      .support {

        margin-top: 28px;
      }

    }


    /* ==========================================
       VERY SMALL PHONES
    ========================================== */

    @media (max-width: 380px) {

      .page {

        padding: 12px;
      }


      .card {

        padding:
          38px 17px
          32px;
      }


      .hero-heart {

        width: 76px;
        height: 76px;

        font-size: 34px;
      }


      h1 {

        font-size: 48px;
      }

    }


    /* ==========================================
       REDUCED MOTION
    ========================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

    }

  </style>

</head>


<body>


  <!-- ==========================================
       BACKGROUND
  ========================================== -->

  <div class="glow one"></div>

  <div class="glow two"></div>


  <!-- ==========================================
       FLOATING HEARTS
  ========================================== -->

  <div
    class="hearts"
    aria-hidden="true"
  >

    <span class="heart">❤️</span>

    <span class="heart">💗</span>

    <span class="heart">💕</span>

    <span class="heart">❤️</span>

    <span class="heart">💗</span>

  </div>


  <!-- ==========================================
       MAIN PAGE
  ========================================== -->

  <main class="page">

    <div class="wrapper">


      <div class="brand">
        Moment
      </div>


      <section class="card">


        <!-- ==================================
             HERO
        =================================== -->

        <div class="hero-heart">
          ❤️
        </div>


        <p class="eyebrow">
          A little something special
        </p>


        <h1>
          Moment
        </h1>


        <p class="subtitle">
          Create a beautiful invitation
          for someone who means the world
          to you. ❤️
        </p>


        <div class="divider"></div>


        <!-- ==================================
             ACTIONS
        =================================== -->

        <div class="actions">

          <a
            class="button primary"
            href="/create"
          >
            Create an invitation ❤️
          </a>


          <a
            class="button secondary"
            href="/invitation"
          >
            Open invitation
          </a>

        </div>


        <p class="support">
          Simple. Personal. Made for your moment.
        </p>


      </section>


      <footer class="footer">
        MADE WITH MOMENT ❤️
      </footer>


    </div>

  </main>


</body>

</html>
```
