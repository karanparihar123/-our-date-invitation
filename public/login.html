<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Moment — Login or create your account."
  >

  <title>Moment ❤️ — Login</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #fff;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(255,255,255,.12),
          transparent 25%
        ),

        radial-gradient(
          circle at 90% 75%,
          rgba(255,105,150,.18),
          transparent 30%
        ),

        linear-gradient(
          145deg,
          #160817 0%,
          #3b0c2f 42%,
          #761842 72%,
          #d65c7d 100%
        );

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .glow {
      position: fixed;

      width: 360px;
      height: 360px;

      border-radius: 50%;

      filter: blur(100px);

      opacity: .18;

      pointer-events: none;

      z-index: 0;

      animation:
        glowMove 9s ease-in-out infinite alternate;
    }


    .glow.one {
      background: #ff719b;

      top: -160px;
      left: -120px;
    }


    .glow.two {
      background: #ffb3ca;

      right: -150px;
      bottom: -150px;

      animation-delay: 3s;
    }


    @keyframes glowMove {

      from {
        transform:
          translate(0,0)
          scale(1);
      }

      to {
        transform:
          translate(35px,-20px)
          scale(1.15);
      }

    }


    .hearts {
      position: fixed;

      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: 0;
    }


    .heart {
      position: absolute;

      bottom: -50px;

      opacity: 0;

      animation:
        floatUp linear infinite;
    }


    .heart:nth-child(1) {
      left: 7%;
      font-size: 18px;
      animation-duration: 11s;
    }


    .heart:nth-child(2) {
      left: 25%;
      font-size: 14px;
      animation-duration: 14s;
      animation-delay: 2s;
    }


    .heart:nth-child(3) {
      left: 50%;
      font-size: 22px;
      animation-duration: 10s;
      animation-delay: 4s;
    }


    .heart:nth-child(4) {
      left: 74%;
      font-size: 16px;
      animation-duration: 13s;
      animation-delay: 1s;
    }


    .heart:nth-child(5) {
      left: 91%;
      font-size: 20px;
      animation-duration: 12s;
      animation-delay: 5s;
    }


    @keyframes floatUp {

      0% {
        transform:
          translateY(0)
          rotate(0deg);

        opacity: 0;
      }

      15% {
        opacity: .38;
      }

      80% {
        opacity: .2;
      }

      100% {
        transform:
          translateY(-115vh)
          rotate(35deg);

        opacity: 0;
      }

    }


    .page {
      position: relative;

      z-index: 2;

      width:
        min(
          430px,
          calc(100% - 30px)
        );
    }


    .logo {
      text-align: center;

      margin-bottom: 22px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 30px;
    }


    .card {
      padding: 35px 30px;

      border-radius: 30px;

      border:
        1px solid
        rgba(255,255,255,.18);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.14),
          rgba(255,255,255,.055)
        );

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);

      box-shadow:
        0 35px 90px
        rgba(0,0,0,.38);
    }


    .card h1 {
      margin:
        0 0 10px;

      text-align: center;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-weight: normal;

      font-size: 38px;
    }


    .subtitle {
      margin:
        0 0 28px;

      text-align: center;

      color:
        rgba(255,255,255,.58);

      font-size: 14px;

      line-height: 1.6;
    }


    .tabs {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 5px;

      padding: 5px;

      margin-bottom: 25px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.07);
    }


    .tab {
      border: 0;

      padding: 10px;

      border-radius: 999px;

      background: transparent;

      color:
        rgba(255,255,255,.55);

      cursor: pointer;

      font-size: 13px;

      transition:
        background .2s ease,
        color .2s ease;
    }


    .tab.active {
      background:
        rgba(255,255,255,.15);

      color: #fff;
    }


    .field {
      margin-bottom: 17px;
    }


    .field label {
      display: block;

      margin-bottom: 7px;

      color:
        rgba(255,255,255,.7);

      font-size: 12px;
    }


    .field input {
      width: 100%;

      padding:
        13px 14px;

      border-radius: 13px;

      border:
        1px solid
        rgba(255,255,255,.15);

      outline: none;

      background:
        rgba(255,255,255,.07);

      color: #fff;

      font-size: 14px;

      transition:
        border .2s ease,
        background .2s ease;
    }


    .field input::placeholder {
      color:
        rgba(255,255,255,.35);
    }


    .field input:focus {
      border-color:
        rgba(255,190,210,.6);

      background:
        rgba(255,255,255,.10);
    }


    .primary {
      width: 100%;

      min-height: 50px;

      border: 0;

      border-radius: 999px;

      background: #fff;

      color: #74153f;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 14px 35px
        rgba(0,0,0,.22);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }


    .primary:hover {
      transform:
        translateY(-2px);

      box-shadow:
        0 18px 40px
        rgba(0,0,0,.28);
    }


    .primary:disabled {
      opacity: .6;

      cursor: not-allowed;

      transform: none;
    }


    .message {
      min-height: 20px;

      margin-top: 15px;

      text-align: center;

      font-size: 12px;

      line-height: 1.5;

      color:
        rgba(255,255,255,.65);
    }


    .message.error {
      color:
        #ffd1da;
    }


    .message.success {
      color:
        #d5ffd9;
    }


    .back-link {
      display: block;

      margin-top: 22px;

      text-align: center;

      color:
        rgba(255,255,255,.5);

      font-size: 12px;

      text-decoration: none;
    }


    .back-link:hover {
      color: #fff;
    }


    .hidden {
      display: none !important;
    }


    @media (max-width: 500px) {

      .card {
        padding:
          30px 22px;
      }


      .card h1 {
        font-size: 34px;
      }

    }

  </style>

</head>


<body>


  <div class="glow one"></div>

  <div class="glow two"></div>


  <div
    class="hearts"
    aria-hidden="true"
  >

    <span class="heart">❤️</span>
    <span class="heart">💗</span>
    <span class="heart">💕</span>
    <span class="heart">❤️</span>
    <span class="heart">💗</span>

  </div>


  <div class="page">


    <div class="logo">
      Moment ❤️
    </div>


    <div class="card">


      <h1 id="pageTitle">
        Welcome back.
      </h1>


      <p
        id="pageSubtitle"
        class="subtitle"
      >
        Sign in to create your next little moment.
      </p>


      <div class="tabs">

        <button
          id="loginTab"
          class="tab active"
          type="button"
        >
          Login
        </button>


        <button
          id="signupTab"
          class="tab"
          type="button"
        >
          Create account
        </button>

      </div>


      <!-- LOGIN FORM -->

      <form
        id="loginForm"
      >

        <div class="field">

          <label for="loginEmail">
            Email
          </label>

          <input
            id="loginEmail"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="loginPassword">
            Password
          </label>

          <input
            id="loginPassword"
            type="password"
            placeholder="Your password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          id="loginButton"
          class="primary"
          type="submit"
        >
          Login ❤️
        </button>


        <div
          id="loginMessage"
          class="message"
        ></div>

      </form>


      <!-- SIGNUP FORM -->

      <form
        id="signupForm"
        class="hidden"
      >

        <div class="field">

          <label for="signupName">
            Name
          </label>

          <input
            id="signupName"
            type="text"
            placeholder="Your name"
            autocomplete="name"
            required
          >

        </div>


        <div class="field">

          <label for="signupEmail">
            Email
          </label>

          <input
            id="signupEmail"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="signupPassword">
            Password
          </label>

          <input
            id="signupPassword"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>


        <button
          id="signupButton"
          class="primary"
          type="submit"
        >
          Create account ❤️
        </button>


        <div
          id="signupMessage"
          class="message"
        ></div>

      </form>


      <a
        href="/"
        class="back-link"
      >
        ← Back to Moment
      </a>


    </div>

  </div>


  <script>

    /* ==========================================
       SUPABASE CONFIGURATION
    ========================================== */

    const SUPABASE_URL =
      "https://bvzyntkrmqwdszoduyjv.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_A4gADA7QSShJeSFdbPcaOw_56Nh_XQW";


    const {
      createClient
    } = window.supabase;


    const supabaseClient =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* ==========================================
       ELEMENTS
    ========================================== */

    const loginTab =
      document.getElementById(
        "loginTab"
      );


    const signupTab =
      document.getElementById(
        "signupTab"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const signupForm =
      document.getElementById(
        "signupForm"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const signupButton =
      document.getElementById(
        "signupButton"
      );


    const loginMessage =
      document.getElementById(
        "loginMessage"
      );


    const signupMessage =
      document.getElementById(
        "signupMessage"
      );


    const pageTitle =
      document.getElementById(
        "pageTitle"
      );


    const pageSubtitle =
      document.getElementById(
        "pageSubtitle"
      );


    /* ==========================================
       TAB SWITCHING
    ========================================== */

    function showLogin() {

      loginTab.classList.add(
        "active"
      );

      signupTab.classList.remove(
        "active"
      );


      loginForm.classList.remove(
        "hidden"
      );

      signupForm.classList.add(
        "hidden"
      );


      pageTitle.textContent =
        "Welcome back.";


      pageSubtitle.textContent =
        "Sign in to create your next little moment.";


      clearMessages();

    }


    function showSignup() {

      signupTab.classList.add(
        "active"
      );

      loginTab.classList.remove(
        "active"
      );


      signupForm.classList.remove(
        "hidden"
      );

      loginForm.classList.add(
        "hidden"
      );


      pageTitle.textContent =
        "Create your account.";


      pageSubtitle.textContent =
        "Make your first little moment.";


      clearMessages();

    }


    loginTab.addEventListener(
      "click",
      showLogin
    );


    signupTab.addEventListener(
      "click",
      showSignup
    );


    /* ==========================================
       MESSAGES
    ========================================== */

    function clearMessages() {

      loginMessage.textContent = "";
      signupMessage.textContent = "";

      loginMessage.className =
        "message";

      signupMessage.className =
        "message";

    }


    function showLoginError(
      message
    ) {

      loginMessage.textContent =
        message;

      loginMessage.className =
        "message error";

    }


    function showSignupError(
      message
    ) {

      signupMessage.textContent =
        message;

      signupMessage.className =
        "message error";

    }


    function showSignupSuccess(
      message
    ) {

      signupMessage.textContent =
        message;

      signupMessage.className =
        "message success";

    }


    /* ==========================================
       LOGIN
    ========================================== */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearMessages();


        const email =
          document
            .getElementById("loginEmail")
            .value
            .trim();


        const password =
          document
            .getElementById("loginPassword")
            .value;


        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });


          if (error) {

            console.error(
              "Login failed:",
              error
            );


            showLoginError(
              error.message ||
              "Unable to log in. Please check your details."
            );


            loginButton.disabled =
              false;

            loginButton.textContent =
              "Login ❤️";

            return;

          }


          /*
           * Login was explicitly performed
           * by the user.
           *
           * Therefore we can take them to
           * the Create Invitation page.
           */

          if (
            data?.session &&
            data?.user
          ) {

            window.location.href =
              "/create";

          }

          else {

            showLoginError(
              "Login completed, but no session was created."
            );


            loginButton.disabled =
              false;

            loginButton.textContent =
              "Login ❤️";

          }

        }

        catch (error) {

          console.error(
            "Login error:",
            error
          );


          showLoginError(
            "Something went wrong. Please try again."
          );


          loginButton.disabled =
            false;

          loginButton.textContent =
            "Login ❤️";

        }

      }
    );


    /* ==========================================
       SIGN UP
    ========================================== */

    signupForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearMessages();


        const name =
          document
            .getElementById("signupName")
            .value
            .trim();


        const email =
          document
            .getElementById("signupEmail")
            .value
            .trim();


        const password =
          document
            .getElementById("signupPassword")
            .value;


        signupButton.disabled = true;

        signupButton.textContent =
          "Creating account...";


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth.signUp({

              email,

              password,

              options: {

                data: {

                  full_name: name

                }

              }

            });


          if (error) {

            console.error(
              "Signup failed:",
              error
            );


            showSignupError(
              error.message ||
              "Unable to create your account."
            );


            signupButton.disabled =
              false;

            signupButton.textContent =
              "Create account ❤️";

            return;

          }


          /*
           * Depending on the Supabase
           * email-confirmation configuration,
           * signup may or may not return
           * an active session.
           */

          if (
            data?.session &&
            data?.user
          ) {

            window.location.href =
              "/create";

            return;

          }


          /*
           * Email confirmation is required.
           */

          showSignupSuccess(
            "Account created. Please check your email to confirm your account, then log in."
          );


          signupButton.disabled =
            false;

          signupButton.textContent =
            "Create account ❤️";


          setTimeout(
            () => {

              showLogin();

              document
                .getElementById("loginEmail")
                .value = email;

            },
            1800
          );

        }

        catch (error) {

          console.error(
            "Signup error:",
            error
          );


          showSignupError(
            "Something went wrong. Please try again."
          );


          signupButton.disabled =
            false;

          signupButton.textContent =
            "Create account ❤️";

        }

      }
    );


    /* ==========================================
       IMPORTANT:
       DO NOT REDIRECT EXISTING SESSION
       ========================================== */

    async function checkExistingSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          console.error(
            "Could not check existing session:",
            error
          );

          return;

        }


        /*
         * IMPORTANT:
         *
         * If the user is already logged in
         * and opens /login, we DO NOT redirect
         * them to /create.
         *
         * They should remain on the login page.
         *
         * This prevents:
         *
         * /create
         *    ↓ Back
         * /login
         *    ↓ existing session
         * /create
         *
         * redirect loop.
         */

        const session =
          data?.session;


        if (
          session &&
          session.user
        ) {

          console.log(
            "Existing Supabase session detected. Staying on login page."
          );

        }

      }

      catch (error) {

        console.error(
          "Existing session check failed:",
          error
        );

      }

    }


    /* ==========================================
       AUTH STATE LISTENER
       ========================================== */

    supabaseClient.auth.onAuthStateChange(
      (
        event,
        session
      ) => {

        console.log(
          "Supabase auth event:",
          event
        );


        /*
         * Do NOT redirect here.
         *
         * The login page must not automatically
         * redirect an already-authenticated user
         * to /create.
         *
         * Navigation happens only after an
         * explicit successful Login or Signup.
         */

      }
    );


    /* ==========================================
       INITIALIZE
       ========================================== */

    checkExistingSession();

  </script>


</body>

</html>
