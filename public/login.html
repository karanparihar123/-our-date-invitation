<!doctype html>
<html lang="en">

  <style>

    /* ==========================================
       RESET
    ========================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }


    body {

      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;

      overflow-x: hidden;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: #fff;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(255,255,255,.16),
          transparent 25%
        ),

        radial-gradient(
          circle at 85% 85%,
          rgba(255,120,160,.25),
          transparent 30%
        ),

        linear-gradient(
          145deg,

          #761842 72%,

    /* ==========================================
       BACKGROUND GLOW
    ========================================== */

    .glow {

      position: fixed;

      width: 330px;
      height: 330px;

      border-radius: 50%;

      filter: blur(90px);

      opacity: .22;

      pointer-events: none;

      z-index: 0;

      animation:
        glowMove 8s ease-in-out infinite alternate;
    }


    .glow.one {

      top: -120px;
      left: -100px;

      background: #ff7fa5;
    }


    .glow.two {

      right: -120px;
      bottom: -130px;

      background: #ffb6cf;

      animation-delay: 2s;
    }


    @keyframes glowMove {

      from {
        transform:
          translate(0,0)
          scale(1);
      }

      to {
        transform:
          translate(35px,-25px)
          scale(1.15);
      }

    }


    /* ==========================================
       FLOATING HEARTS
    ========================================== */

    .hearts {

      position: fixed;

      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: 1;
    }


    .heart {

      position: absolute;

      bottom: -50px;

      opacity: 0;

      animation:
        rise linear infinite;
    }


    .heart:nth-child(1) {

      left: 8%;
      font-size: 18px;
      animation-duration: 10s;
    }


    .heart:nth-child(2) {

      left: 23%;
      font-size: 13px;
      animation-duration: 13s;
      animation-delay: 3s;
    }


    .heart:nth-child(3) {

      left: 48%;
      font-size: 20px;
      animation-duration: 11s;
      animation-delay: 1s;
    }


    .heart:nth-child(4) {

      left: 72%;
      font-size: 15px;
      animation-duration: 14s;
      animation-delay: 4s;
    }


    .heart:nth-child(5) {

      left: 91%;
      font-size: 19px;
      animation-duration: 12s;
      animation-delay: 2s;
    }


    @keyframes rise {

      0% {

        transform:
          translateY(0)
          rotate(0deg);

        opacity: 0;
      }

      15% {
        opacity: .45;
      }

      85% {
        opacity: .25;
      }

      100% {

        transform:
          translateY(-115vh)
          rotate(35deg);

        opacity: 0;
      }

    }


    /* ==========================================
       PAGE
    ========================================== */

    .page {

      position: relative;

      z-index: 2;

      width: 100%;

      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        24px;
    }


    .wrapper {

      width:
        min(
          440px,
          100%
        );
    }


    /* ==========================================
       BRAND
    ========================================== */

    .brand {

      text-align: center;

      font-family:
        Arial,
        sans-serif;

      font-size: 11px;

      letter-spacing: 5px;

      text-transform: uppercase;

      opacity: .65;

      margin-bottom: 18px;
    }


    /* ==========================================
       CARD
    ========================================== */

    .card {

      position: relative;

      padding:
        38px 28px
        32px;

      border:
        1px solid
        rgba(255,255,255,.22);

      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.16),
          rgba(255,255,255,.07)
        );

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);

      box-shadow:
        0 30px 90px
        rgba(0,0,0,.38);

      overflow: hidden;

      animation:
        cardIn .7s ease-out;
    }


    .card::before {

      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,.14),
          transparent 40%
        );

      pointer-events: none;
    }


    @keyframes cardIn {

      from {

        opacity: 0;

        transform:
          translateY(25px)
          scale(.97);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    /* ==========================================
       HEART
    ========================================== */

    .login-heart {

      position: relative;

      z-index: 2;

      width: 72px;
      height: 72px;

      margin:
        0 auto
        18px;

      display: flex;

      justify-content: center;

      border-radius: 50%;

      background:
        rgba(255,255,255,.12);

      border:
        1px solid

      animation:

    @keyframes pulse {

      0%,100% {
        transform: scale(1);
      }

        transform: scale(1.06);
      }

    }


    /* ==========================================
       TITLE
    ========================================== */

    .title {

      position: relative;

      z-index: 2;

      margin: 0;

      text-align: center;

      font-size:
        clamp(
          34px,
          9vw,

        );

      font-weight: normal;
    }


    .subtitle {

      position: relative;

        12px auto

        Arial,

    }


    /* ==========================================
       TABS

    .tabs {

      position: relative;

    }

    .tab.active {

    /* ==========================================
       FORM

    .form {

    .field {

    /* ==========================================

    ========================================== */

    .submit-button {

    .submit-button:hover {

    .submit-button:active {

      transform:

    /* ==========================================
       MESSAGE
    ========================================== */

    .message {

      position: relative;

      z-index: 2;

      min-height: 22px;

      margin:
        15px 0 0;

      text-align: center;

      font-family:

    .message.error {

      color:

    }


    /* ==========================================
       FOOTER LINKS
    ========================================== */

    .bottom-text {

      position: relative;

      z-index: 2;

      margin-top: 24px;

      text-align: center;

      font-family:
        Arial,

    /* ==========================================

    .logged-in {

    .continue-button {

      display: block;

      padding:
        14px;

    }


    /* ==========================================
       HIDDEN
    ========================================== */

    .hidden {

    }


    /* ==========================================

    @media (max-width: 600px) {

  </style>

</head>


<body>


  <!-- ==========================================
       BACKGROUND
  ========================================== -->

  <div class="glow one"></div>

  <div class="glow two"></div>


  <!-- ==========================================
       FLOATING HEARTS
  ========================================== -->

  <div
    class="hearts"
    aria-hidden="true"
  >

    <span class="heart">❤️</span>
    <span class="heart">💗</span>
    <span class="heart">💕</span>
    <span class="heart">❤️</span>
    <span class="heart">💗</span>

  </div>


  <!-- ==========================================
       PAGE

  <main class="page">

    <div class="wrapper">


      <div class="brand">
        Moment
      </div>


      <section class="card">


        <!-- ====================================
             HEART
        ===================================== -->

        <div class="login-heart">

        </div>


        <!-- ====================================
             TITLE
        ===================================== -->

        </h1>


        <p class="subtitle">

          id="signupForm"

        >

        </a>

  </main>


  <script>

    /* ==========================================
       ELEMENTS
    ========================================== */

    const loginTab =
      document.getElementById(
        "loginTab"
      );


    const signupTab =
      document.getElementById(
        "signupTab"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const signupForm =
      document.getElementById(
        "signupForm"
      );


    const loggedInView =
      document.getElementById(
        "loggedInView"
      );


    const loginMessage =
      document.getElementById(
        "loginMessage"
      );


    const signupMessage =
      document.getElementById(
        "signupMessage"
      );


    const loggedInText =
      document.getElementById(
        "loggedInText"
      );


    const continueButton =
      document.getElementById(
        "continueButton"
      );


    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    /* ==========================================
       STORAGE KEYS
    ========================================== */

    const USER_KEY =
      "moment_user";


    const ACCOUNT_KEY =
      "moment_account";


    /* ==========================================
       SWITCH TO LOGIN
    ========================================== */

    loginTab.addEventListener(
      "click",
      () => {

        loginTab.classList.add(
          "active"
        );

        signupTab.classList.remove(
          "active"
        );

        loginForm.classList.remove(
          "hidden"
        );

        signupForm.classList.add(
          "hidden"
        );

        clearMessages();

      }
    );


    /* ==========================================
       SWITCH TO SIGNUP
    ========================================== */

    signupTab.addEventListener(
      "click",
      () => {

        signupTab.classList.add(
          "active"
        );

        loginTab.classList.remove(
          "active"
        );

        signupForm.classList.remove(
          "hidden"
        );

        loginForm.classList.add(
          "hidden"
        );

        clearMessages();

      }
    );


    /* ==========================================
       CLEAR MESSAGES
    ========================================== */

    function clearMessages() {

      loginMessage.textContent =
        "";

      signupMessage.textContent =
        "";

      loginMessage.className =
        "message";

      signupMessage.className =
        "message";

    }


    /* ==========================================
       SHOW MESSAGE
    ========================================== */

    function showMessage(
      element,
      message,
      type
    ) {

      element.textContent =
        message;

      element.className =
        `message ${type}`;

    }


    /* ==========================================
       SAVE ACCOUNT
    ========================================== */

    function saveAccount(
      name,
      email,
      password
    ) {

      const account = {

        name:
          name.trim(),

        email:
          email.trim().toLowerCase(),

        password:
          password

      };


      localStorage.setItem(
        ACCOUNT_KEY,
        JSON.stringify(account)
      );


      return account;

    }


    /* ==========================================
       GET ACCOUNT
    ========================================== */

    function getAccount() {

      try {

        const stored =
          localStorage.getItem(
            ACCOUNT_KEY
          );


        if (!stored) {

          return null;

        }


        return JSON.parse(
          stored
        );

      }

      catch (error) {

        console.error(
          "Could not read account:",
          error
        );

        return null;

      }

    }


    /* ==========================================
       SET LOGGED IN USER
    ========================================== */

    function setLoggedInUser(
      account
    ) {

      const user = {

        name:
          account.name,

        email:
          account.email,

        loggedIn:
          true

      };


      localStorage.setItem(
        USER_KEY,
        JSON.stringify(user)
      );

    }


    /* ==========================================
       GET LOGGED IN USER
    ========================================== */

    function getLoggedInUser() {

      try {

        const stored =
          localStorage.getItem(
            USER_KEY
          );


        if (!stored) {

          return null;

        }


        return JSON.parse(
          stored
        );

      }

      catch (error) {

        return null;

      }

    }


    /* ==========================================
       LOGIN
    ========================================== */

    loginForm.addEventListener(
      "submit",
      (event) => {

        event.preventDefault();


        const email =
          document
            .getElementById(
              "loginEmail"
            )
            .value
            .trim()
            .toLowerCase();


        const password =
          document
            .getElementById(
              "loginPassword"
            )
            .value;


        const account =
          getAccount();


        /*
         * No account yet.
         */

        if (!account) {

          showMessage(
            loginMessage,
            "No account found. Create an account first. ❤️",
            "error"
          );

          return;

        }


        /*
         * Check email.
         */

        if (
          email !==
          account.email
        ) {

          showMessage(
            loginMessage,
            "The email or password is incorrect.",
            "error"
          );

          return;

        }


        /*
         * Check password.
         */

        if (
          password !==
          account.password
        ) {

          showMessage(
            loginMessage,
            "The email or password is incorrect.",
            "error"
          );

          return;

        }


        /*
         * Login successful.
         */

        setLoggedInUser(
          account
        );


        showMessage(
          loginMessage,
          "Login successful! ❤️",
          "success"
        );


        setTimeout(
          () => {

            window.location.href =
              "/";

          },
          500
        );

      }
    );


    /* ==========================================
       CREATE ACCOUNT
    ========================================== */

    signupForm.addEventListener(
      "submit",
      (event) => {

        event.preventDefault();


        const name =
          document
            .getElementById(
              "signupName"
            )
            .value
            .trim();


        const email =
          document
            .getElementById(
              "signupEmail"
            )
            .value
            .trim()
            .toLowerCase();


        const password =
          document
            .getElementById(
              "signupPassword"
            )
            .value;


        const confirmPassword =
          document
            .getElementById(
              "signupConfirmPassword"
            )
            .value;


        /*
         * Validate name.
         */

        if (
          name.length < 2
        ) {

          showMessage(
            signupMessage,
            "Please enter your name.",
            "error"
          );

          return;

        }


        /*
         * Validate email.
         */

        const emailPattern =
          /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (
          !emailPattern.test(
            email
          )
        ) {

          showMessage(
            signupMessage,
            "Please enter a valid email address.",
            "error"
          );

          return;

        }


        /*
         * Validate password.
         */

        if (
          password.length < 6
        ) {

          showMessage(
            signupMessage,
            "Password must be at least 6 characters.",
            "error"
          );

          return;

        }


        /*
         * Confirm password.
         */

        if (
          password !==
          confirmPassword
        ) {

          showMessage(
            signupMessage,
            "Passwords do not match.",
            "error"
          );

          return;

        }


        /*
         * Check existing account.
         */

        const existingAccount =
          getAccount();


        if (
          existingAccount &&
          existingAccount.email ===
            email
        ) {

          showMessage(
            signupMessage,
            "An account with this email already exists.",
            "error"
          );

          return;

        }


        /*
         * Save account.
         */

        const account =
          saveAccount(
            name,
            email,
            password
          );


        /*
         * Automatically log in.
         */

        setLoggedInUser(
          account
        );


        showMessage(
          signupMessage,
          "Account created! Welcome to Moment ❤️",
          "success"
        );


        setTimeout(
          () => {

            window.location.href =
              "/";

          },
          700
        );

      }
    );


    /* ==========================================
       CONTINUE
    ========================================== */

    continueButton.addEventListener(
      "click",
      () => {

        window.location.href =
          "/";

      }
    );


    /* ==========================================
       LOGOUT
    ========================================== */

    logoutButton.addEventListener(
      "click",
      () => {

        localStorage.removeItem(
          USER_KEY
        );


        showLoggedOutState();

      }
    );


    /* ==========================================
       SHOW LOGGED OUT STATE
    ========================================== */

    function showLoggedOutState() {

      loggedInView.classList.add(
        "hidden"
      );

      loginForm.classList.remove(
        "hidden"
      );

      signupForm.classList.add(
        "hidden"
      );

      loginTab.classList.add(
        "active"
      );

      signupTab.classList.remove(
        "active"
      );

      clearMessages();

    }


    /* ==========================================
       SHOW LOGGED IN STATE
    ========================================== */

    function showLoggedInState(
      user
    ) {

      loginForm.classList.add(
        "hidden"
      );

      signupForm.classList.add(
        "hidden"
      );

      loginTab.classList.remove(
        "active"
      );

      signupTab.classList.remove(
        "active"
      );

      loggedInView.classList.remove(
        "hidden"
      );


      loggedInText.textContent =
        `Welcome back, ${user.name}. Your moments are waiting for you. ❤️`;

    }


    /* ==========================================
       INITIAL CHECK
    ========================================== */

    const loggedInUser =
      getLoggedInUser();


    if (
      loggedInUser &&
      loggedInUser.loggedIn
    ) {

      showLoggedInState(
        loggedInUser
      );

    }

  </script>
